<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Test E2E contra un servidor real usando WorkOSTestTokenSigner">
  <defs>
    <marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #f8f9fb; }
    .title { font: 600 20px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .subtitle { font: 400 13.5px -apple-system, Helvetica, Arial, sans-serif; fill: #57606a; }
    .actor { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .actorText { font: 700 13.5px -apple-system, Helvetica, Arial, sans-serif; fill: #312e81; }
    .life { stroke: #c7cad1; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .req { stroke: #24292f; stroke-width: 1.6; fill: none; marker-end: url(#arrowE); }
    .res { stroke: #57606a; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowE); }
    .lbl { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1a202c; }
    .lbl2 { font: 400 11.5px -apple-system, Helvetica, Arial, sans-serif; fill: #57606a; font-style: italic; }
    .step { font: 700 12px -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .stepBg { fill: #4338ca; }
    .ok { fill: #1e7e34; }
    .bad { fill: #b45309; }
    .setup { fill: #f6f8fa; stroke: #d0d7de; }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="660" rx="12"/>
  <text x="30" y="32" class="title">Test E2E contra un servidor real</text>
  <text x="30" y="52" class="subtitle">WorkOSTestTokenSigner firma tokens que tu servidor verifica por su camino normal — sin atajos de test</text>

  <rect class="setup" x="40" y="66" width="820" height="56" rx="8"/>
  <text x="450" y="88" text-anchor="middle" font-size="12.5" font-family="-apple-system, Helvetica, Arial, sans-serif" fill="#1a202c">Preparación: se genera un par de claves RSA de prueba y se levanta una Authorization Server falsa que solo</text>
  <text x="450" y="106" text-anchor="middle" font-size="12.5" font-family="-apple-system, Helvetica, Arial, sans-serif" fill="#1a202c">sirve un documento JWKS con la clave pública, en la URL que tu app espera como &lt;issuer&gt;/oauth2/jwks</text>

  <!-- Actors -->
  <rect class="actor" x="40" y="140" width="220" height="42" rx="8"/>
  <text x="150" y="166" text-anchor="middle" class="actorText">Suite de tests E2E</text>
  <rect class="actor" x="370" y="140" width="220" height="42" rx="8"/>
  <text x="480" y="166" text-anchor="middle" class="actorText">Tu servidor (bajo test)</text>
  <rect class="actor" x="690" y="140" width="190" height="42" rx="8"/>
  <text x="785" y="160" text-anchor="middle" class="actorText">Authorization Server</text>
  <text x="785" y="176" text-anchor="middle" class="actorText">falsa</text>

  <line x1="150" y1="182" x2="150" y2="620" class="life"/>
  <line x1="480" y1="182" x2="480" y2="620" class="life"/>
  <line x1="785" y1="182" x2="785" y2="620" class="life"/>

  <!-- 1 -->
  <circle class="stepBg" cx="150" cy="210" r="11"/><text x="150" y="214" text-anchor="middle" class="step">1</text>
  <path d="M150,220 H480" class="req"/>
  <text x="166" y="216" class="lbl">GET /ruta-protegida</text>
  <text x="166" y="237" class="lbl2">Authorization: Bearer &lt;signer.validToken()&gt;</text>

  <!-- 2 -->
  <circle class="stepBg" cx="480" cy="270" r="11"/><text x="480" y="274" text-anchor="middle" class="step">2</text>
  <path d="M480,280 H785" class="req"/>
  <text x="496" y="276" class="lbl" font-size="11">GET &lt;issuer&gt;/oauth2/jwks</text>
  <text x="496" y="296" class="lbl2">RemoteJWKS, solo si la caché está vacía</text>

  <!-- 3 -->
  <circle class="ok" cx="785" cy="322" r="11"/><text x="785" y="326" text-anchor="middle" class="step">3</text>
  <path d="M785,332 H480" class="res"/>
  <text x="496" y="328" class="lbl" font-size="11">200 { keys: [clave pública de prueba] }</text>

  <!-- 4 -->
  <circle class="ok" cx="480" cy="374" r="11"/><text x="480" y="378" text-anchor="middle" class="step">4</text>
  <path d="M480,384 H150" class="res"/>
  <text x="166" y="380" class="lbl">200 OK</text>
  <text x="166" y="401" class="lbl2">verificado por el camino normal (BearerTokenVerifier + RemoteJWKS)</text>

  <!-- separator -->
  <line x1="40" y1="430" x2="860" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <text x="450" y="452" text-anchor="middle" font-size="12.5" font-weight="700" font-family="-apple-system, Helvetica, Arial, sans-serif" fill="#57606a">Variante: comprobar también el rechazo de un token caducado</text>

  <!-- 5 -->
  <circle class="stepBg" cx="150" cy="490" r="11"/><text x="150" y="494" text-anchor="middle" class="step">5</text>
  <path d="M150,500 H480" class="req"/>
  <text x="166" y="496" class="lbl">GET /ruta-protegida</text>
  <text x="166" y="517" class="lbl2">Authorization: Bearer &lt;signer.expiredToken()&gt;</text>

  <!-- 6 -->
  <circle class="bad" cx="480" cy="550" r="11"/><text x="480" y="554" text-anchor="middle" class="step">6</text>
  <path d="M480,560 H150" class="res"/>
  <text x="166" y="556" class="lbl">401 Unauthorized</text>

  <rect class="setup" x="40" y="590" width="820" height="46" rx="8"/>
  <text x="450" y="613" text-anchor="middle" font-size="12" font-family="-apple-system, Helvetica, Arial, sans-serif" fill="#1a202c">No hay ningún paso "especial para tests" en el servidor: verifica el token exactamente igual que a uno real de WorkOS.</text>
</svg>
