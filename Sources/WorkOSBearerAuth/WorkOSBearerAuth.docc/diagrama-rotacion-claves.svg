<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cuándo RemoteJWKS refresca sus claves cacheadas">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #f8f9fb; }
    .box { fill: #ffffff; stroke: #4a5568; stroke-width: 1.5; }
    .decision { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .note { fill: #fff8e6; stroke: #b45309; stroke-width: 1.5; }
    .ok { fill: #e6f4ea; stroke: #1e7e34; stroke-width: 1.5; }
    .bad { fill: #fff4e5; stroke: #b45309; stroke-width: 1.5; }
    .title { font: 600 20px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .subtitle { font: 400 13.5px -apple-system, Helvetica, Arial, sans-serif; fill: #57606a; }
    .body { font: 400 14px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .lbl { font: 700 12.5px -apple-system, Helvetica, Arial, sans-serif; fill: #4338ca; }
    .arrowlbl { font: 600 12px -apple-system, Helvetica, Arial, sans-serif; fill: #57606a; }
    .edge { fill: none; stroke: #4a5568; stroke-width: 1.6; marker-end: url(#arrow); }
    .edgeDashed { fill: none; stroke: #4338ca; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="780" rx="12"/>
  <text x="30" y="36" class="title">¿Cuándo refresca RemoteJWKS sus claves cacheadas?</text>
  <text x="30" y="56" class="subtitle">No en cada petición: solo ante un indicio real de rotación, y con salvaguardas para no convertirse en un vector de abuso</text>

  <!-- Box 1 -->
  <rect class="box" x="60" y="80" width="520" height="54" rx="8"/>
  <text x="320" y="102" text-anchor="middle" class="body">Llega una petición con un token</text>
  <text x="320" y="122" text-anchor="middle" class="body">(su cabecera lleva un <tspan font-weight="700">kid</tspan>)</text>
  <line x1="320" y1="134" x2="320" y2="160" class="edge"/>

  <!-- Box 2: decision -->
  <rect class="decision" x="60" y="160" width="520" height="58" rx="8"/>
  <text x="320" y="184" text-anchor="middle" class="body">¿Ese <tspan font-weight="700">kid</tspan> está entre las claves</text>
  <text x="320" y="204" text-anchor="middle" class="body">que la caché ya reconoce?</text>

  <!-- Fast path label + dashed line down the right side -->
  <text x="605" y="176" class="lbl">SÍ</text>
  <path d="M 580 189 H 830 V 547" class="edgeDashed"/>
  <text x="836" y="360" class="arrowlbl" transform="rotate(90 836 360)">usar la caché tal cual — sin red</text>

  <text x="320" y="238" text-anchor="middle" class="arrowlbl">NO</text>
  <line x1="320" y1="218" x2="320" y2="252" class="edge"/>

  <!-- Box 3 -->
  <rect class="box" x="60" y="252" width="520" height="62" rx="8"/>
  <text x="320" y="277" text-anchor="middle" class="body">No reconocido → se pide un refresco</text>
  <text x="320" y="297" text-anchor="middle" class="body"><tspan font-weight="700">forzado</tspan> (posible rotación de clave en WorkOS)</text>
  <line x1="320" y1="314" x2="320" y2="340" class="edge"/>

  <!-- Box 4: decision -->
  <rect class="decision" x="60" y="340" width="520" height="80" rx="8"/>
  <text x="320" y="364" text-anchor="middle" class="body">¿Ya hay un refresco en marcha, o seguimos</text>
  <text x="320" y="384" text-anchor="middle" class="body">dentro del tiempo de espera (cooldown) tras</text>
  <text x="320" y="404" text-anchor="middle" class="body">un intento reciente?</text>

  <text x="320" y="452" text-anchor="middle" class="arrowlbl">NO</text>
  <line x1="320" y1="420" x2="320" y2="456" class="edge"/>

  <!-- side box for "Sí" of box4 -->
  <path d="M 580 380 H 650" class="edge"/>
  <text x="656" y="360" class="lbl">SÍ</text>
  <rect class="note" x="612" y="340" width="248" height="150" rx="8"/>
  <text x="736" y="366" text-anchor="middle" class="body" font-weight="700">No se lanza una nueva</text>
  <text x="736" y="386" text-anchor="middle" class="body" font-weight="700">consulta HTTP</text>
  <text x="736" y="412" text-anchor="middle" class="body" font-size="13">Se reutiliza el refresco que</text>
  <text x="736" y="430" text-anchor="middle" class="body" font-size="13">ya está en vuelo, o se sigue</text>
  <text x="736" y="448" text-anchor="middle" class="body" font-size="13">con las claves actuales sin</text>
  <text x="736" y="466" text-anchor="middle" class="body" font-size="13">reintentar todavía.</text>
  <path d="M 736 490 V 547 H 583" class="edge"/>

  <!-- Box 5 -->
  <rect class="box" x="60" y="456" width="520" height="62" rx="8"/>
  <text x="320" y="481" text-anchor="middle" class="body">Se consulta por HTTP el JWKS publicado</text>
  <text x="320" y="501" text-anchor="middle" class="body">por WorkOS y se actualizan caché + <tspan font-weight="700">kid</tspan> conocidos</text>
  <line x1="320" y1="518" x2="320" y2="544" class="edge"/>

  <!-- Merge box 6 -->
  <rect class="box" x="60" y="544" width="520" height="58" rx="8" fill="#f6f8fa"/>
  <text x="320" y="568" text-anchor="middle" class="body">Se verifica el token contra las claves</text>
  <text x="320" y="588" text-anchor="middle" class="body">resultantes (firma, issuer, audiencia, exp/nbf)</text>
  <line x1="240" y1="602" x2="240" y2="628" class="edge"/>
  <line x1="420" y1="602" x2="420" y2="628" class="edge"/>

  <!-- Outcomes -->
  <rect class="ok" x="60" y="628" width="330" height="50" rx="8"/>
  <text x="225" y="658" text-anchor="middle" class="body">✓ Válido → la petición continúa</text>
  <rect class="bad" x="420" y="628" width="290" height="50" rx="8"/>
  <text x="565" y="658" text-anchor="middle" class="body">✗ Inválido → 401</text>

  <!-- Footnote -->
  <rect x="60" y="700" width="810" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="76" y="722" class="body" font-weight="700" font-size="13">¿Por qué tantas salvaguardas para refrescar?</text>
  <text x="76" y="742" class="body" font-size="12.5">Si cualquier token con un kid falso disparase una consulta a WorkOS, bastaría con enviar basura para forzar tráfico</text>
  <text x="76" y="758" class="body" font-size="12.5">de red repetido. El cooldown y la fusión de refrescos concurrentes evitan esa vía de abuso barata.</text>
</svg>
