<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomía de un JSON Web Token: header, payload y firma">
  <style>
    .bg { fill: #f8f9fb; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .title { font: 600 20px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .subtitle { font: 400 14px -apple-system, Helvetica, Arial, sans-serif; fill: #57606a; }
    .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { font: 700 13px -apple-system, Helvetica, Arial, sans-serif; }
    .body { font: 400 13px -apple-system, Helvetica, Arial, sans-serif; fill: #24292f; }
    .dot { font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #57606a; }
  </style>
  <rect class="bg" x="0" y="0" width="920" height="480" rx="12"/>
  <text x="30" y="38" class="title">Anatomía de un JWT: tres partes unidas por puntos</text>
  <text x="30" y="60" class="subtitle">Cada parte va codificada en Base64URL — es legible por cualquiera, no está cifrada</text>

  <!-- Token bar -->
  <rect x="30" y="82" width="270" height="42" rx="6" fill="#ffe5e9" stroke="#d1263f"/>
  <text x="165" y="108" text-anchor="middle" class="mono" fill="#9a0f28">eyJhbGciOiJSUzI1NiJ9</text>
  <text x="308" y="108" text-anchor="middle" class="dot">.</text>
  <rect x="322" y="82" width="330" height="42" rx="6" fill="#efe3ff" stroke="#6f2dbd"/>
  <text x="487" y="108" text-anchor="middle" class="mono" fill="#4c1d95">eyJpc3MiOiAiaHR0cHM6Ly8uLi4</text>
  <text x="660" y="108" text-anchor="middle" class="dot">.</text>
  <rect x="674" y="82" width="216" height="42" rx="6" fill="#dff5f2" stroke="#0f766e"/>
  <text x="782" y="108" text-anchor="middle" class="mono" fill="#0f5c53">SIGNATURE</text>

  <!-- Connector lines -->
  <line x1="165" y1="124" x2="165" y2="160" stroke="#d1263f" stroke-width="1.5"/>
  <line x1="487" y1="124" x2="487" y2="160" stroke="#6f2dbd" stroke-width="1.5"/>
  <line x1="782" y1="124" x2="782" y2="160" stroke="#0f766e" stroke-width="1.5"/>

  <!-- Header card -->
  <rect class="card" x="30" y="160" width="270" height="150" rx="10"/>
  <rect x="30" y="160" width="270" height="34" rx="10" fill="#d1263f"/>
  <rect x="30" y="176" width="270" height="18" fill="#d1263f"/>
  <text x="165" y="183" text-anchor="middle" class="label" fill="#ffffff">HEADER</text>
  <text x="46" y="216" class="body">• <tspan class="mono" font-size="13">alg</tspan>: algoritmo de firma</text>
  <text x="46" y="238" class="body">  (WorkOS usa <tspan font-weight="700">RS256</tspan>)</text>
  <text x="46" y="264" class="body">• <tspan class="mono" font-size="13">kid</tspan>: qué clave pública</text>
  <text x="46" y="286" class="body">  del JWKS lo verifica</text>

  <!-- Payload card -->
  <rect class="card" x="322" y="160" width="330" height="150" rx="10"/>
  <rect x="322" y="160" width="330" height="34" rx="10" fill="#6f2dbd"/>
  <rect x="322" y="176" width="330" height="18" fill="#6f2dbd"/>
  <text x="487" y="183" text-anchor="middle" class="label" fill="#ffffff">PAYLOAD (claims)</text>
  <text x="338" y="214" class="body"><tspan class="mono" font-size="13">iss</tspan> — quién lo emitió (WorkOS)</text>
  <text x="338" y="236" class="body"><tspan class="mono" font-size="13">aud</tspan> — para qué recurso vale</text>
  <text x="338" y="258" class="body"><tspan class="mono" font-size="13">exp</tspan> / <tspan class="mono" font-size="13">nbf</tspan> — ventana temporal válida</text>
  <text x="338" y="280" class="body"><tspan class="mono" font-size="13">sub</tspan> — identificador del usuario</text>
  <text x="338" y="300" class="subtitle" font-style="italic">Nunca guardes secretos aquí: se puede leer.</text>

  <!-- Signature card -->
  <rect class="card" x="674" y="160" width="216" height="150" rx="10"/>
  <rect x="674" y="160" width="216" height="34" rx="10" fill="#0f766e"/>
  <rect x="674" y="176" width="216" height="18" fill="#0f766e"/>
  <text x="782" y="183" text-anchor="middle" class="label" fill="#ffffff">FIRMA</text>
  <text x="690" y="216" class="body">Calculada con la</text>
  <text x="690" y="236" class="body">clave <tspan font-weight="700">privada</tspan> de WorkOS</text>
  <text x="690" y="266" class="body">sobre header + payload.</text>
  <text x="690" y="288" class="body">Prueba autoría e</text>
  <text x="690" y="308" class="body">integridad, no confidencialidad.</text>

  <!-- Bottom explanation -->
  <rect class="card" x="30" y="335" width="860" height="115" rx="10" fill="#f6f8fa"/>
  <text x="50" y="365" class="label" fill="#1a202c">¿Por qué "firmado" y no "cifrado"?</text>
  <text x="50" y="390" class="body">Un sobre transparente con un sello de lacre: cualquiera puede leer lo que hay dentro, pero solo el sello</text>
  <text x="50" y="410" class="body">(la firma) demuestra que lo envió quien dice haberlo enviado y que nadie lo ha tocado por el camino.</text>
  <text x="50" y="432" class="body">Verificar la firma solo confirma "esto lo firmó WorkOS y no lo modificó nadie" — no oculta el contenido.</text>
</svg>
