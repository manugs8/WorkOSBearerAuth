<svg viewBox="0 0 1000 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las tres configuraciones posibles de configureBearerAuth">
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #f8f9fb; }
    .box { fill: #ffffff; stroke: #4a5568; stroke-width: 1.5; }
    .decision { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .neutral { fill: #f1f3f5; stroke: #495057; stroke-width: 1.5; }
    .ok { fill: #e6f4ea; stroke: #1e7e34; stroke-width: 1.5; }
    .warn { fill: #fff4e5; stroke: #b45309; stroke-width: 1.5; }
    .err { fill: #fdecea; stroke: #b91c1c; stroke-width: 1.5; }
    .title { font: 600 20px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .subtitle { font: 400 13.5px -apple-system, Helvetica, Arial, sans-serif; fill: #57606a; }
    .body { font: 400 13px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .caseLbl { font: 700 12.5px -apple-system, Helvetica, Arial, sans-serif; }
    .lbl { font: 700 12px -apple-system, Helvetica, Arial, sans-serif; fill: #4338ca; }
    .edge { fill: none; stroke: #4a5568; stroke-width: 1.6; marker-end: url(#arrowC); }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="960" rx="12"/>
  <text x="30" y="34" class="title">Las tres configuraciones de arranque</text>
  <text x="30" y="54" class="subtitle">Cómo decide configureBearerAuth qué hacer, según el entorno de Vapor y el caso de BearerAuthEnvironmentConfig recibido</text>

  <!-- Start -->
  <rect class="box" x="90" y="80" width="340" height="46" rx="8"/>
  <text x="260" y="108" text-anchor="middle" class="body">Se llama a configureBearerAuth(app, environment:)</text>
  <line x1="260" y1="126" x2="260" y2="150" class="edge"/>

  <!-- D1: .testing short-circuit, narrowed to .disabled/.workOS -->
  <rect class="decision" x="90" y="150" width="340" height="82" rx="8"/>
  <text x="260" y="173" text-anchor="middle" class="body">¿app.environment == .testing</text>
  <text x="260" y="191" text-anchor="middle" class="body">Y environment es .disabled</text>
  <text x="260" y="209" text-anchor="middle" class="body">o .workOS?</text>
  <text x="446" y="187" class="lbl">SÍ</text>
  <path d="M430,191 H560" class="edge"/>
  <rect class="neutral" x="560" y="160" width="410" height="62" rx="8"/>
  <text x="765" y="182" text-anchor="middle" class="body caseLbl">CASO 1</text>
  <text x="765" y="200" text-anchor="middle" class="body" font-size="11.5">Se omite. .local nunca entra aquí — por construcción solo</text>
  <text x="765" y="214" text-anchor="middle" class="body" font-size="11.5">habla con un mock loopback, nunca con WorkOS real.</text>

  <text x="278" y="252" class="lbl">NO</text>
  <line x1="260" y1="232" x2="260" y2="262" class="edge"/>

  <!-- D2: .disabled? -->
  <rect class="decision" x="90" y="262" width="340" height="60" rx="8"/>
  <text x="260" y="287" text-anchor="middle" class="body">¿environment</text>
  <text x="260" y="305" text-anchor="middle" class="body">== .disabled?</text>
  <text x="446" y="288" class="lbl">SÍ</text>
  <path d="M430,292 H560" class="edge"/>
  <rect class="decision" x="560" y="265" width="410" height="54" rx="8"/>
  <text x="765" y="287" text-anchor="middle" class="body">¿app.environment</text>
  <text x="765" y="305" text-anchor="middle" class="body">== .production?</text>

  <text x="846" y="352" class="lbl">SÍ</text>
  <path d="M840,319 V389" class="edge"/>
  <rect class="err" x="770" y="389" width="200" height="60" rx="8"/>
  <text x="870" y="409" text-anchor="middle" class="body" font-size="11.5" font-weight="700">Lanza missing-</text>
  <text x="870" y="427" text-anchor="middle" class="body" font-size="11.5" font-weight="700">WorkOSEnvironment.</text>
  <text x="870" y="441" text-anchor="middle" class="body" font-size="11.5">No arranca.</text>

  <text x="584" y="352" class="lbl">NO</text>
  <path d="M620,319 V389" class="edge"/>
  <rect class="warn" x="560" y="389" width="180" height="76" rx="8"/>
  <text x="650" y="411" text-anchor="middle" class="body caseLbl">CASO 2</text>
  <text x="650" y="429" text-anchor="middle" class="body" font-size="11.5">Auth desactivada,</text>
  <text x="650" y="443" text-anchor="middle" class="body" font-size="11.5">con aviso registrado</text>
  <text x="650" y="457" text-anchor="middle" class="body" font-size="11.5">(logger.warning)</text>

  <text x="278" y="342" class="lbl">NO</text>
  <line x1="260" y1="322" x2="260" y2="352" class="edge"/>

  <!-- D3: .local? -->
  <rect class="decision" x="90" y="352" width="340" height="60" rx="8"/>
  <text x="260" y="377" text-anchor="middle" class="body">¿environment</text>
  <text x="260" y="395" text-anchor="middle" class="body">== .local(port:...)?</text>

  <text x="446" y="378" class="lbl">SÍ</text>
  <path d="M430,382 H495 V566 H560" class="edge"/>
  <rect class="decision" x="560" y="539" width="410" height="54" rx="8"/>
  <text x="765" y="561" text-anchor="middle" class="body">¿app.environment</text>
  <text x="765" y="579" text-anchor="middle" class="body">== .production?</text>

  <text x="846" y="626" class="lbl">SÍ</text>
  <path d="M840,593 V663" class="edge"/>
  <rect class="err" x="770" y="663" width="200" height="60" rx="8"/>
  <text x="870" y="683" text-anchor="middle" class="body" font-size="11.5" font-weight="700">Lanza local-</text>
  <text x="870" y="701" text-anchor="middle" class="body" font-size="11.5" font-weight="700">ConfigInProduction.</text>
  <text x="870" y="715" text-anchor="middle" class="body" font-size="11.5">No arranca.</text>

  <text x="584" y="626" class="lbl">NO</text>
  <path d="M620,593 V663" class="edge"/>
  <rect class="ok" x="560" y="663" width="200" height="104" rx="8"/>
  <text x="660" y="685" text-anchor="middle" class="body caseLbl">CASO 3 (.local)</text>
  <text x="660" y="703" text-anchor="middle" class="body" font-size="11.5">Verifica contra</text>
  <text x="660" y="717" text-anchor="middle" class="body" font-size="11.5">http://127.0.0.1:&lt;puerto&gt;</text>
  <text x="660" y="731" text-anchor="middle" class="body" font-size="11.5">construido por la librería —</text>
  <text x="660" y="745" text-anchor="middle" class="body" font-size="11.5">incluso bajo .testing</text>

  <text x="278" y="470" class="lbl">NO</text>
  <text x="284" y="487" class="body" font-size="11">(.workOS)</text>
  <path d="M260,412 V820" class="edge"/>

  <!-- Final: .workOS -->
  <rect class="ok" x="90" y="820" width="340" height="90" rx="8"/>
  <text x="260" y="844" text-anchor="middle" class="body caseLbl">CASO 3 (.workOS)</text>
  <text x="260" y="862" text-anchor="middle" class="body">Valida que el issuer sea https://, valida</text>
  <text x="260" y="880" text-anchor="middle" class="body">los resource indicators, y activa JWT/JWKS</text>
  <text x="260" y="898" text-anchor="middle" class="body">real — también en producción</text>
</svg>
