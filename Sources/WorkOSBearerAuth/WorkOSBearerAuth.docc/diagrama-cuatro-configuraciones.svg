<svg viewBox="0 0 940 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las cuatro configuraciones posibles de configureBearerAuth">
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #f8f9fb; }
    .box { fill: #ffffff; stroke: #4a5568; stroke-width: 1.5; }
    .decision { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .neutral { fill: #f1f3f5; stroke: #495057; stroke-width: 1.5; }
    .ok { fill: #e6f4ea; stroke: #1e7e34; stroke-width: 1.5; }
    .warn { fill: #fff4e5; stroke: #b45309; stroke-width: 1.5; }
    .err { fill: #fdecea; stroke: #b91c1c; stroke-width: 1.5; }
    .title { font: 600 20px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .subtitle { font: 400 13.5px -apple-system, Helvetica, Arial, sans-serif; fill: #57606a; }
    .body { font: 400 13px -apple-system, Helvetica, Arial, sans-serif; fill: #1a202c; }
    .caseLbl { font: 700 12.5px -apple-system, Helvetica, Arial, sans-serif; }
    .lbl { font: 700 12px -apple-system, Helvetica, Arial, sans-serif; fill: #4338ca; }
    .edge { fill: none; stroke: #4a5568; stroke-width: 1.6; marker-end: url(#arrowC); }
  </style>
  <rect class="bg" x="0" y="0" width="940" height="800" rx="12"/>
  <text x="30" y="34" class="title">Las cuatro configuraciones de arranque</text>
  <text x="30" y="54" class="subtitle">Cómo decide configureBearerAuth qué hacer, según el entorno de Vapor y la configuración de WorkOS recibida</text>

  <!-- Start -->
  <rect class="box" x="90" y="85" width="340" height="46" rx="8"/>
  <text x="260" y="113" text-anchor="middle" class="body">Se llama a configureBearerAuth(app, environment:)</text>
  <line x1="260" y1="131" x2="260" y2="155" class="edge"/>

  <!-- D1 -->
  <rect class="decision" x="90" y="155" width="340" height="60" rx="8"/>
  <text x="260" y="180" text-anchor="middle" class="body">¿app.environment</text>
  <text x="260" y="198" text-anchor="middle" class="body">== .testing?</text>
  <text x="446" y="181" class="lbl">SÍ</text>
  <path d="M430,185 H560" class="edge"/>
  <rect class="neutral" x="560" y="160" width="330" height="50" rx="8"/>
  <text x="725" y="180" text-anchor="middle" class="body caseLbl">CASO 1</text>
  <text x="725" y="198" text-anchor="middle" class="body">Se omite por completo, pase lo que pase en `environment`</text>

  <text x="278" y="233" class="lbl">NO</text>
  <line x1="260" y1="215" x2="260" y2="245" class="edge"/>

  <!-- D2 -->
  <rect class="decision" x="90" y="245" width="340" height="60" rx="8"/>
  <text x="260" y="270" text-anchor="middle" class="body">¿environment.authDisabled</text>
  <text x="260" y="288" text-anchor="middle" class="body">== true?</text>
  <text x="446" y="271" class="lbl">SÍ</text>
  <path d="M430,275 H560" class="edge"/>
  <rect class="decision" x="560" y="248" width="330" height="54" rx="8"/>
  <text x="725" y="270" text-anchor="middle" class="body">¿app.environment</text>
  <text x="725" y="288" text-anchor="middle" class="body">== .production?</text>

  <text x="806" y="335" class="lbl">SÍ</text>
  <path d="M800,302 V372" class="edge"/>
  <rect class="err" x="730" y="372" width="160" height="60" rx="8"/>
  <text x="810" y="392" text-anchor="middle" class="body caseLbl">CASO 2</text>
  <text x="810" y="410" text-anchor="middle" class="body" font-size="11.5">Lanza authDisabledInProduction.</text>
  <text x="810" y="424" text-anchor="middle" class="body" font-size="11.5">No arranca.</text>

  <text x="584" y="335" class="lbl">NO</text>
  <path d="M620,302 V372" class="edge"/>
  <rect class="warn" x="560" y="372" width="150" height="76" rx="8"/>
  <text x="635" y="394" text-anchor="middle" class="body caseLbl">CASO 3</text>
  <text x="635" y="412" text-anchor="middle" class="body" font-size="11.5">Auth desactivada,</text>
  <text x="635" y="426" text-anchor="middle" class="body" font-size="11.5">con aviso registrado</text>
  <text x="635" y="440" text-anchor="middle" class="body" font-size="11.5">(logger.warning)</text>

  <text x="278" y="323" class="lbl">NO</text>
  <line x1="260" y1="305" x2="260" y2="335" class="edge"/>

  <!-- D3 -->
  <rect class="decision" x="90" y="335" width="340" height="76" rx="8"/>
  <text x="260" y="360" text-anchor="middle" class="body">¿workOSIssuer Y workOSResource-</text>
  <text x="260" y="378" text-anchor="middle" class="body">IndicatorsRaw están</text>
  <text x="260" y="396" text-anchor="middle" class="body">configurados?</text>

  <text x="446" y="401" class="lbl">NO</text>
  <path d="M430,373 H495 V487 H560" class="edge"/>
  <rect class="decision" x="560" y="460" width="330" height="54" rx="8"/>
  <text x="725" y="482" text-anchor="middle" class="body">¿app.environment</text>
  <text x="725" y="500" text-anchor="middle" class="body">== .production?</text>

  <text x="806" y="555" class="lbl">SÍ</text>
  <path d="M800,514 V587" class="edge"/>
  <rect class="err" x="730" y="587" width="160" height="60" rx="8"/>
  <text x="810" y="607" text-anchor="middle" class="body" font-size="11.5" font-weight="700">Lanza missing-</text>
  <text x="810" y="621" text-anchor="middle" class="body" font-size="11.5" font-weight="700">WorkOSEnvironment.</text>
  <text x="810" y="637" text-anchor="middle" class="body" font-size="11.5">No arranca.</text>

  <text x="584" y="555" class="lbl">NO</text>
  <path d="M620,514 V587" class="edge"/>
  <rect class="warn" x="560" y="587" width="150" height="76" rx="8"/>
  <text x="635" y="609" text-anchor="middle" class="body caseLbl">CASO 3</text>
  <text x="635" y="627" text-anchor="middle" class="body" font-size="11.5">(mismo resultado:</text>
  <text x="635" y="641" text-anchor="middle" class="body" font-size="11.5">desactivada, con</text>
  <text x="635" y="655" text-anchor="middle" class="body" font-size="11.5">aviso registrado)</text>

  <text x="278" y="558" class="lbl">SÍ</text>
  <path d="M260,411 V700" class="edge"/>

  <!-- Final -->
  <rect class="ok" x="90" y="700" width="340" height="76" rx="8"/>
  <text x="260" y="724" text-anchor="middle" class="body caseLbl">CASO 4</text>
  <text x="260" y="742" text-anchor="middle" class="body">Se validan URLs e indicadores, y se</text>
  <text x="260" y="760" text-anchor="middle" class="body">activa JWT/JWKS real — también en producción</text>
</svg>
